<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block title %}AI Finance Assistant{% endblock %}</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
{% if user_name %}
<nav class="navbar">
  <div class="nav-brand">💰 AI Finance Assistant</div>
  <div class="nav-links">
    <a href="{{ url_for('dashboard_page') }}">Dashboard</a>
    <a href="{{ url_for('transactions_page') }}">Transactions</a>
    <a href="{{ url_for('budgets_page') }}">Budgets</a>
    <a href="{{ url_for('chatbot_page') }}"> Chatbot</a>
    <span class="nav-user">Hi, {{ user_name }}</span>
    <a href="{{ url_for('logout') }}" class="logout-link">Logout</a>
  </div>
</nav>
{% endif %}
<main class="container">
  {% block content %}{% endblock %}
</main>
<script src="{{ url_for('static', filename='app.js') }}"></script>
{% block scripts %}{% endblock %}
</body>
</html>
