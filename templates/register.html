{% extends "base.html" %}
{% block title %}Register{% endblock %}
{% block content %}
<div class="auth-card">
  <h1>Create your account</h1>
  <p class="subtitle">Start tracking your finances with AI-powered insights</p>
  <form id="register-form">
    <label>Name</label>
    <input type="text" id="name" required>
    <label>Email</label>
    <input type="email" id="email" required autocomplete="email">
    <label>Password</label>
    <input type="password" id="password" required minlength="6" autocomplete="new-password">
    <div id="error-msg" class="error-msg"></div>
    <button type="submit">Register</button>
  </form>
  <p class="switch-link">Already have an account? <a href="{{ url_for('login_page') }}">Log in</a></p>
</div>
{% endblock %}
{% block scripts %}
<script>
document.getElementById('register-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const errorEl = document.getElementById('error-msg');
  errorEl.textContent = '';
  const res = await fetch('/register', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({
      name: document.getElementById('name').value,
      email: document.getElementById('email').value,
      password: document.getElementById('password').value
    })
  });
  const data = await res.json();
  if (res.ok) {
    window.location.href = '/dashboard-page';
  } else {
    errorEl.textContent = data.error || 'Registration failed';
  }
});
</script>
{% endblock %}
