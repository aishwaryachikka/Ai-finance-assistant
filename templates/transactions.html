{% extends "base.html" %}
{% block title %}Transactions{% endblock %}
{% block content %}
<h1>Transactions</h1>

<div class="panel">
  <h2>Add Transaction</h2>
  <form id="txn-form" class="txn-form">
    <div class="form-row">
      <div>
        <label>Type</label>
        <select id="type">
          <option value="expense">Expense</option>
          <option value="income">Income</option>
        </select>
      </div>
      <div>
        <label>Date</label>
        <input type="date" id="date">
      </div>
      <div>
        <label>Amount</label>
        <input type="number" id="amount" step="0.01" min="0.01" required>
      </div>
    </div>
    <label>Description</label>
    <input type="text" id="description" placeholder="e.g. swiggy dinner 450" required>

    <div class="predict-row">
      <button type="button" id="predict-btn">🔮 Predict Category</button>
      <span id="predict-result"></span>
    </div>

    <label>Category</label>
    <select id="category">
      <option value="">-- auto-predict on save --</option>
      {% for c in categories %}
      <option value="{{ c }}">{{ c }}</option>
      {% endfor %}
    </select>

    <button type="submit" class="primary-btn">Add Transaction</button>
  </form>
</div>

<div class="panel">
  <h2>History</h2>
  <input type="text" id="search-box" placeholder="Search transactions..." class="search-box">
  <table class="txn-table">
    <thead>
      <tr><th>Date</th><th>Description</th><th>Category</th><th>Type</th><th>Amount</th><th></th></tr>
    </thead>
    <tbody id="txn-body"></tbody>
  </table>
  <div id="txn-empty" class="empty-state" style="display:none;">No transactions yet. Add one above.</div>
</div>
{% endblock %}
{% block scripts %}
<script>
const rupee = (n) => 'Rs. ' + Number(n).toLocaleString('en-IN', {maximumFractionDigits: 2});
let allTxns = [];
let editingId = null;

document.getElementById('date').valueAsDate = new Date();

document.getElementById('predict-btn').addEventListener('click', async () => {
  const description = document.getElementById('description').value;
  if (!description.trim()) return;
  const res = await fetch('/predict-category', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({description})
  });
  const data = await res.json();
  document.getElementById('predict-result').textContent =
    `→ ${data.predicted_category} (confidence: ${(data.confidence*100).toFixed(0)}%)`;
  document.getElementById('category').value = data.predicted_category;
});

document.getElementById('txn-form').addEventListener('submit', async (e) => {
  e.preventDefault();

  const payload = {
    type: document.getElementById('type').value,
    date: document.getElementById('date').value,
    amount: document.getElementById('amount').value,
    description: document.getElementById('description').value,
    category: document.getElementById('category').value || null
  };

  let url = '/transactions';
  let method = 'POST';

  if (editingId !== null) {
    url = `/transactions/${editingId}`;
    method = 'PUT';
  }

  const res = await fetch(url, {
    method: method,
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify(payload)
  });

  if (res.ok) {
    document.getElementById('txn-form').reset();
    document.getElementById('date').valueAsDate = new Date();
    document.getElementById('predict-result').textContent = '';

    editingId = null;

    document.querySelector('.primary-btn').textContent = 'Add Transaction';

    loadTransactions();
  } else {
    const data = await res.json();
    alert(data.error || 'Failed to save transaction');
  }
});

function renderTxns(txns) {
  const body = document.getElementById('txn-body');
  body.innerHTML = '';
  document.getElementById('txn-empty').style.display = txns.length ? 'none' : 'block';
  txns.forEach(t => {
    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td>${t.date}</td>
      <td>${t.description}</td>
      <td><span class="badge">${t.category || ''}</span></td>
      <td class="type-${t.type}">${t.type}</td>
      <td class="amount-${t.type}">${t.type === 'expense' ? '-' : '+'}${rupee(t.amount)}</td>
      <td>
  <button class="edit-btn" data-id="${t.transaction_id}">✏️</button>
  <button class="del-btn" data-id="${t.transaction_id}">✕</button>
</td>
    `;
    body.appendChild(tr);
  });
  document.querySelectorAll('.del-btn').forEach(btn => {
    btn.addEventListener('click', async () => {
      if (!confirm('Delete this transaction?')) return;
      await fetch(`/transactions/${btn.dataset.id}`, {method: 'DELETE'});
      loadTransactions();
    });
  });
  document.querySelectorAll('.edit-btn').forEach(btn => {
  btn.addEventListener('click', () => {

    const id = Number(btn.dataset.id);

    const transaction = allTxns.find(
      t => t.transaction_id === id
    );

    if (!transaction) return;

    document.getElementById('type').value = transaction.type;
    document.getElementById('date').value = transaction.date;
    document.getElementById('amount').value = transaction.amount;
    document.getElementById('description').value = transaction.description;
    document.getElementById('category').value = transaction.category || '';

    editingId = id;

    document.querySelector('.primary-btn').textContent = 'Update Transaction';

    document.getElementById('txn-form').scrollIntoView({
      behavior: 'smooth'
    });
  });
});
}

async function loadTransactions() {
  const res = await fetch('/transactions');
  allTxns = await res.json();
  renderTxns(allTxns);
}

document.getElementById('search-box').addEventListener('input', (e) => {
  const q = e.target.value.toLowerCase();
  renderTxns(allTxns.filter(t =>
    t.description.toLowerCase().includes(q) || (t.category || '').toLowerCase().includes(q)
  ));
});

loadTransactions();
</script>
{% endblock %}
